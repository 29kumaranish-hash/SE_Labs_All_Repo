name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit

      - name: Run flake8
        run: flake8 student_grade_system.py | tee flake8_report.txt

      - name: Run pylint
        run: pylint student_grade_system.py | tee pylint_report.txt
        continue-on-error: true

      - name: Run bandit
        run: bandit -r student_grade_system.py -f txt -o bandit_report.txt
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            flake8_report.txt
            pylint_report.txt
            bandit_report.txt